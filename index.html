<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7fb">
  <title>Biodata Sederhana</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      background:
        radial-gradient(ellipse at 10% 0%, #e8edff 0, transparent 38%),
        #f5f7fb;
    }

    main {
      width: min(100%, 720px);
      margin: 0 auto;
    }

    .intro {
      margin-bottom: 24px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #5368c8;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      letter-spacing: -0.04em;
    }

    .intro p:last-child {
      margin: 10px 0 0;
      color: #667085;
    }

    .card {
      padding: clamp(22px, 5vw, 36px);
      border: 1px solid #e7eaf1;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 16px 48px rgb(34 48 94 / 8%);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px 16px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label,
    legend {
      color: #344054;
      font-size: 0.9rem;
      font-weight: 650;
    }

    .required {
      color: #d04444;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border: 1px solid #d6dae4;
      border-radius: 10px;
      outline: none;
      background: #fff;
      color: #172033;
      font: inherit;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #6678d8;
      box-shadow: 0 0 0 3px rgb(102 120 216 / 16%);
    }

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .radio-options {
      display: flex;
      min-height: 46px;
      align-items: center;
      gap: 22px;
    }

    .radio-option {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #475467;
      font-size: 0.92rem;
      font-weight: 450;
    }

    .radio-option input {
      width: 17px;
      min-height: 17px;
      height: 17px;
      margin: 0;
      accent-color: #5368c8;
    }

    button {
      width: 100%;
      min-height: 48px;
      margin-top: 24px;
      border: 0;
      border-radius: 10px;
      background: #5368c8;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      transition: background 150ms ease, transform 150ms ease;
    }

    button:hover {
      background: #4358b7;
    }

    button:active {
      transform: translateY(1px);
    }

    .result {
      margin-top: 22px;
    }

    .result[hidden] {
      display: none;
    }

    .result h2 {
      margin: 0 0 14px;
      font-size: 1.2rem;
    }

    .result dl {
      display: grid;
      grid-template-columns: minmax(120px, 0.7fr) 1.3fr;
      gap: 12px 16px;
      margin: 0;
    }

    .result dt {
      color: #667085;
    }

    .result dd {
      margin: 0;
      overflow-wrap: anywhere;
      font-weight: 600;
    }

    @media (max-width: 560px) {
      body {
        padding: 32px 16px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .result dl {
        grid-template-columns: 1fr;
        gap: 4px;
      }

      .result dd {
        margin-bottom: 10px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="intro">
      <p class="eyebrow">Formulir</p>
      <h1>Biodata Sederhana</h1>
      <p>Isi data diri kamu pada formulir berikut.</p>
    </header>

    <section class="card" aria-label="Formulir biodata">
      <form id="biodata-form">
        <div class="form-grid">
          <div class="field full">
            <label for="nama">Nama lengkap <span class="required" aria-hidden="true">*</span></label>
            <input id="nama" name="nama" type="text" autocomplete="name" placeholder="Contoh: Andi Saputra" required>
          </div>

          <div class="field">
            <label for="tempat-lahir">Tempat lahir</label>
            <input id="tempat-lahir" name="tempatLahir" type="text" placeholder="Contoh: Bandung">
          </div>

          <div class="field">
            <label for="tanggal-lahir">Tanggal lahir <span class="required" aria-hidden="true">*</span></label>
            <input id="tanggal-lahir" name="tanggalLahir" type="date" required>
          </div>

          <fieldset class="field full">
            <legend>Jenis kelamin <span class="required" aria-hidden="true">*</span></legend>
            <div class="radio-options">
              <label class="radio-option"><input name="jenisKelamin" type="radio" value="Laki-laki" required> Laki-laki</label>
              <label class="radio-option"><input name="jenisKelamin" type="radio" value="Perempuan"> Perempuan</label>
            </div>
          </fieldset>

          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="nama@email.com">
          </div>

          <div class="field">
            <label for="telepon">Nomor telepon</label>
            <input id="telepon" name="telepon" type="tel" autocomplete="tel" placeholder="Contoh: 081234567890">
          </div>

          <div class="field full">
            <label for="alamat">Alamat <span class="required" aria-hidden="true">*</span></label>
            <textarea id="alamat" name="alamat" autocomplete="street-address" placeholder="Masukkan alamat lengkap" required></textarea>
          </div>

          <div class="field full">
            <label for="hobi">Hobi</label>
            <input id="hobi" name="hobi" type="text" placeholder="Contoh: Membaca, bersepeda">
          </div>
        </div>

        <button type="submit">Tampilkan Biodata</button>
      </form>

      <section id="hasil" class="result" aria-live="polite" hidden>
        <h2>Biodata kamu</h2>
        <dl id="detail-biodata"></dl>
      </section>
    </section>
  </main>

  <script>
    const form = document.querySelector("#biodata-form");
    const result = document.querySelector("#hasil");
    const details = document.querySelector("#detail-biodata");

    const biodataFields = [
      ["nama", "Nama lengkap"],
      ["tempatLahir", "Tempat lahir"],
      ["tanggalLahir", "Tanggal lahir"],
      ["jenisKelamin", "Jenis kelamin"],
      ["email", "Email"],
      ["telepon", "Nomor telepon"],
      ["alamat", "Alamat"],
      ["hobi", "Hobi"]
    ];

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const data = new FormData(form);
      details.replaceChildren();

      for (const [name, label] of biodataFields) {
        const value = data.get(name)?.toString().trim();
        if (!value) continue;

        const term = document.createElement("dt");
        term.textContent = label;

        const description = document.createElement("dd");
        description.textContent = name === "tanggalLahir"
          ? new Date(`${value}T00:00:00`).toLocaleDateString("id-ID", {
              day: "numeric",
              month: "long",
              year: "numeric"
            })
          : value;

        details.append(term, description);
      }

      result.hidden = false;
    });
  </script>
</body>
</html>
